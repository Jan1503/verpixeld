# Portainer: Images → Import the tar from build.ps1, then Stacks → Add stack → paste this.
# Set Network__Host to the panel IP. Unicast UDP works on the bridge; discovery (VPXD)
# needs host networking — uncomment network_mode and drop ports if the NAS allows it.
#
# Do not run this at the same time as the Pi host (both would send to UDP 7777).
# Host paths below are TrueNAS examples — change them to yours.

services:
  verpixeld:
    image: verpixeld:nas
    pull_policy: never
    container_name: verpixeld
    restart: unless-stopped
    ports:
      - "5000:5000"
    # Bridge DNS has no mDNS. homeassistant.local will not resolve.
    # extra_hosts:
    #   - "homeassistant.local:192.168.1.20"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Network__Host: "192.168.1.50"
      Network__Port: "7777"
      Network__TargetMbps: "60"
      Network__ColorBits: "14"
      App__OutputMode: "network"
      App__DisplayWidth: "256"
      App__DisplayHeight: "128"
      WebServer__EnableHttps: "false"
      WebServer__HttpPort: "5000"
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
      ASPNETCORE_hostBuilder__reloadConfigOnChange: "false"
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      DOTNET_EnableDiagnostics: "0"
    volumes:
      # Config volume is the overlay (appsettings.json, seam_correction.json, *.json, pfx).
      # Image defaults + compose env apply first; GUI saves land here and survive recreate.
      - /mnt/Applications/Apps/verpixeld/data:/app/Data
      - /mnt/Applications/Apps/verpixeld/config:/app/Config
      # NAS library (movies/series tree). Local Media browses this folder by folder.
      - /mnt/Default/Media:/app/Media:ro
      # Data volume: layouts, gallery, plus Extensions/, Filters/, Fonts/ (seeded from the image).
      # Drop extra BDFs or plugin folders there — no extra mounts.
