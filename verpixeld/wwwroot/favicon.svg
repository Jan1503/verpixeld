<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="verpixeld-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00c8ff"/>
      <stop offset="33%" style="stop-color:#ff007f"/>
      <stop offset="66%" style="stop-color:#ff7f00"/>
      <stop offset="100%" style="stop-color:#9400d3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark background -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="#0a0a0f"/>
  <!-- LED pixel grid pattern -->
  <g opacity="0.4">
    <rect x="4" y="4" width="2" height="2" rx="0.3" fill="#00ffc8"/>
    <rect x="8" y="4" width="2" height="2" rx="0.3" fill="#ff007f"/>
    <rect x="4" y="8" width="2" height="2" rx="0.3" fill="#ff7f00"/>
    <rect x="22" y="22" width="2" height="2" rx="0.3" fill="#00bfff"/>
    <rect x="26" y="26" width="2" height="2" rx="0.3" fill="#9400d3"/>
    <rect x="26" y="4" width="2" height="2" rx="0.3" fill="#ff1493"/>
  </g>
  <!-- Stylized V letter for verpixeld -->
  <text x="16" y="24" 
        font-family="Arial Black, sans-serif" 
        font-size="20" 
        font-weight="900"
        text-anchor="middle" 
        fill="url(#verpixeld-gradient)"
        filter="url(#glow)">V</text>
</svg>
